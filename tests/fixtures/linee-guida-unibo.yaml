content_rules:
  - La relazione deve essere presentata sotto forma di diario dell'esperienza di tirocinio, discutendo nei dettagli il contesto delle attività svolte e il coinvolgimento dello studente.
  - Non deve essere una presentazione ma il resoconto organico delle attività svolte che metta il più possibile in evidenza il contributo individuale e personale dello studente.
  - La relazione deve mettere in evidenza la eventuale originalità del contributo dello studente, soprattutto nel caso di tirocinio svolto nell'ambito di un corso di laurea magistrale.
